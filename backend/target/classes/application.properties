# FindIt - Campus Lost & Found Management System
server.port=8080

# Database Configuration
# Set db.mode=ORACLE to connect to Oracle 19c/21c/23c XE
# Set db.mode=AUTO to attempt Oracle first, falling back to embedded SQL provider if Oracle is offline
db.mode=AUTO

# Oracle JDBC Connection Settings
oracle.url=jdbc:oracle:thin:@localhost:1521/XEPDB1
oracle.user=findit_user
oracle.password=findit_password

# Static Frontend Resources
static.dir=frontend

